<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atta Letterpad Generator - عطا لیٹر پیڈ جنریٹر</title>
    
    <!-- Google Fonts Declarative Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        urdu: ['"Noto Nastaliq Urdu"', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'serif'],
                        amiri: ['Amiri', 'Tahoma', 'serif'],
                    },
                    colors: {
                        primary: '#1d4ed8',
                        secondary: '#be185d',
                        darkbg: '#111827',
                        darkpanel: '#1f2937',
                    }
                }
            }
        };
    </script>

    <!-- Initial Theme Verification -->
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (e) {
            console.warn("Storage access restricted.");
        }
    </script>
    
    <!-- Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Amiri', Tahoma, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .font-urdu-clean {
            font-family: 'Noto Nastaliq Urdu', 'Urdu Typesetting', 'Jameel Noori Nastaleeq', serif;
        }

        /* WCAG AA Visible Focus Rings */
        :focus-visible {
            outline: 2px solid #1d4ed8 !important;
            outline-offset: 2px !important;
        }
        html.dark :focus-visible {
            outline: 2px solid #60a5fa !important;
            outline-offset: 2px !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Unified Urdu Nastaliq Typography Stack */
        .font-urdu-clean, .a4-container {
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Gulzar', 'Amiri', Tahoma, serif;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
            text-rendering: optimizeLegibility;
            letter-spacing: normal !important;
            word-break: normal !important;
            overflow-wrap: normal !important;
        }

        /* A4 Letterpad Canvas with Adaptive Paper Styling (Supports Ivory tone in Tpl 4) */
        .a4-container {
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            margin: 0 auto;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #000000;
            transition: none;
        }

        /* Dark mode paper contrast: Elevated sheet outline */
        .dark .a4-container {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 25px 50px -10px rgba(0, 0, 0, 0.85) !important;
        }
        
        /* Enforce children inside Letterpad to ignore global dark mode styling overrides */
        .a4-container * {
            color: inherit;
        }

        .page-content {
            flex-grow: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* Standardized Letterpad Footer Address with BiDi Isolation */
        .address-text {
            font-size: 1.15rem;
            line-height: 1.85;
            white-space: pre-line;
            unicode-bidi: isolate;
            direction: rtl;
            text-align: right;
        }

        /* Logo display inside Letterpad */
        .pad-logo {
            max-height: 60px;
            max-width: 140px;
            object-fit: contain;
            border-radius: 6px;
        }

        /* BiDi-safe Business Names with Scalable Bounds & Non-locking Alignment */
        .b-name {
            font-size: clamp(1.8rem, 2.5rem, 3.2rem);
            line-height: 1.35;
            unicode-bidi: isolate !important;
            direction: rtl !important;
            text-align: inherit;
            word-break: normal !important;
            overflow-wrap: normal !important;
        }

        /* Standardized Footer Contact Row */
        .b-contact-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .footer-address-item { flex: 1; }
        .footer-contact-item { flex-shrink: 0; }

        /* Bidirectional phone number and code isolation */
        .phone-display {
            direction: ltr !important;
            unicode-bidi: isolate !important;
            display: inline-block !important;
            text-align: left !important;
        }

        /* =========================================
           🎨 TEMPLATES 1 to 5 (Vibrant Classic Designs)
           ========================================= */
        /* Base Letterpad Body Proprietor Row (Right-aligned / RTL Start) */
        .b-prop {
            font-size: 1.25rem;
            font-family: 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', 'Urdu Typesetting', 'Amiri', serif;
            text-align: right;
            direction: rtl;
            color: #0f172a;
            box-sizing: border-box;
            line-height: 1.6;
            width: 100%;
        }
        .b-prop span {
            font-weight: bold;
            margin-left: 6px;
        }
        .b-prop bdi {
            font-weight: bold;
        }

        .tpl-1 .header-area { background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); padding: 18mm 20mm 14mm 20mm; text-align: center; border-bottom: 8px solid #fbbf24; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; }
        .tpl-1 .header-area::after { content: ''; position: absolute; bottom: -12px; left: 10%; right: 10%; height: 4px; background: rgba(251, 191, 36, 0.5); border-radius: 4px; }
        .tpl-1 .b-name { font-size: 3.2rem; font-weight: 700; color: #ffffff; line-height: 1.35; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); text-align: center; }
        .tpl-1 .b-prop { padding: 4mm 20mm 2mm 20mm; text-align: right; direction: rtl; } 
        .tpl-1 .b-prop span { color: #1e3a8a !important; }
        .tpl-1 .b-prop bdi { color: #0f172a; }
        .tpl-1 .footer-area { background-color: #0f172a; padding: 10mm 20mm; border-top: 8px solid #fbbf24; color: #ffffff; position: relative; }
        .tpl-1 .footer-area::before { content: ''; position: absolute; top: -12px; left: 10%; right: 10%; height: 4px; background: rgba(251, 191, 36, 0.5); border-radius: 4px; }
        .tpl-1 .b-contact-row { font-size: 1.2rem; }
        .tpl-1 .b-contact-row .label-text { color: #fbbf24; font-weight: bold; }

        .tpl-2 { flex-direction: row; background: #ffffff; }
        .tpl-2 .sidebar { width: 32%; background-color: #7c3aed; background: linear-gradient(180deg, #db2777 0%, #7c3aed 50%, #2563eb 100%); color: white; padding: 20mm 10mm; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: -6px 0 18px rgba(0,0,0,0.15); z-index: 2; }
        .tpl-2 .main-content { width: 68%; display: flex; flex-direction: column; position: relative; background: #ffffff; }
        .tpl-2 .main-content::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; background: linear-gradient(to top, rgba(37, 99, 235, 0.04), transparent); pointer-events: none; }
        .tpl-2 .b-name { font-size: 2.8rem; font-weight: 700; line-height: 1.35; margin-bottom: 16px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); color: #ffffff; text-align: center; } 
        .tpl-2 .b-prop { padding: 6mm 15mm 2mm 15mm; text-align: right; direction: rtl; }
        .tpl-2 .b-prop span { color: #7c3aed !important; }
        .tpl-2 .b-prop bdi { color: #1e293b; }
        .tpl-2 .footer-area { padding: 10mm 15mm; margin-top: auto; border-top: 2px solid #e5e7eb; background: #ffffff; z-index: 5; }
        .tpl-2 .b-contact-row { flex-direction: column; align-items: flex-start; gap: 12px; font-size: 1.15rem; color: #1f2937; }
        .tpl-2 .footer-address-item, .tpl-2 .footer-contact-item { flex: none; width: 100%; text-align: right; }
        .tpl-2 .b-contact-row .label-text { color: #7c3aed; font-weight: bold; }

        .tpl-3 { background: #ffffff; }
        .tpl-3 .header-area { background-color: #064e3b; background: linear-gradient(135deg, #064e3b 0%, #065f46 100%); padding: 18mm 20mm 24mm 20mm; text-align: center; color: white; border-bottom-left-radius: 50% 20%; border-bottom-right-radius: 50% 20%; box-shadow: 0 10px 20px rgba(6, 78, 59, 0.2); position: relative; }
        .tpl-3 .header-area::after { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; border: 2px dashed rgba(255,255,255,0.3); border-bottom-left-radius: 50% 20%; border-bottom-right-radius: 50% 20%; pointer-events: none; }
        .tpl-3 .b-name { font-size: 3.2rem; font-weight: 700; line-height: 1.35; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); text-align: center; }
        .tpl-3 .b-prop { padding: 4mm 20mm 2mm 20mm; text-align: right; direction: rtl; } 
        .tpl-3 .b-prop span { color: #047857 !important; }
        .tpl-3 .b-prop bdi { color: #064e3b; }
        .tpl-3 .footer-area { background: linear-gradient(to right, #ecfdf5, #ffffff, #ecfdf5); padding: 12mm 20mm; border-top: 3px solid #065f46; margin-top: auto; }
        .tpl-3 .b-contact-row { font-size: 1.2rem; color: #064e3b; }
        .tpl-3 .b-contact-row .label-text { color: #047857; font-weight: bold; }

        /* Template 4 with container-safe boundaries */
        .tpl-4 { background: #fffcf2; }
        .tpl-4 .header-area { background-color: #7f1d1d; background: linear-gradient(90deg, #7f1d1d 0%, #991b1b 100%); color: white; padding: 20mm 20mm; text-align: right; position: relative; overflow: hidden; }
        .tpl-4 .header-area::before { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 0; border-bottom: 35px solid #f59e0b; border-right: 210mm solid transparent; }
        .tpl-4 .header-area::after { content: ''; position: absolute; top: -50px; right: -50px; width: 200px; height: 200px; background: rgba(255,255,255,0.05); border-radius: 50%; }
        .tpl-4 .b-name { font-size: 3.2rem; font-weight: 700; line-height: 1.35; text-shadow: 2px 2px 5px rgba(0,0,0,0.4); position: relative; z-index: 2; text-align: right; }
        .tpl-4 .b-prop { padding: 4mm 20mm 2mm 20mm; position: relative; z-index: 2; text-align: right; direction: rtl; } 
        .tpl-4 .b-prop span { color: #991b1b !important; }
        .tpl-4 .b-prop bdi { color: #450a0a; }
        .tpl-4 .footer-area { background-color: #7f1d1d; color: white; padding: 12mm 20mm; margin-top: auto; position: relative; }
        .tpl-4 .footer-area::before { content: ''; position: absolute; top: 0; right: 0; width: 0; height: 0; border-top: 20px solid #f59e0b; border-left: 210mm solid transparent; }
        .tpl-4 .b-contact-row { font-size: 1.2rem; position: relative; z-index: 2; }
        .tpl-4 .b-contact-row .label-text { color: #fcd34d; font-weight: bold; }

        .tpl-5 { padding: 8mm; background: #ffffff; display: flex; flex-direction: column; }
        .tpl-5 .outer-border { flex-grow: 1; background: #ffffff; border: 2px solid #0f766e; padding: 2mm; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tpl-5 .inner-border { flex-grow: 1; border: 3px solid #0f766e; padding: 12mm; display: flex; flex-direction: column; position: relative; }
        .tpl-5 .header-area { display: flex; justify-content: center; text-align: center; border-bottom: 3px double #d97706; padding-bottom: 15px; margin-bottom: 5px; background: rgba(15, 118, 110, 0.03); padding-top: 10px; }
        .tpl-5 .b-name { font-size: 3rem; font-weight: 700; color: #0f766e; line-height: 1.35; text-shadow: 1px 1px 0px rgba(0,0,0,0.1); text-align: center; }
        .tpl-5 .b-prop { padding: 3mm 0 2mm 0; text-align: right; direction: rtl; }
        .tpl-5 .b-prop span { color: #0f766e !important; }
        .tpl-5 .b-prop bdi { color: #134e4a; }
        .tpl-5 .footer-area { border-top: 3px double #d97706; padding-top: 12px; margin-top: auto; background: rgba(15, 118, 110, 0.03); padding-bottom: 8px; padding-left: 10px; padding-right: 10px; }
        .tpl-5 .b-contact-row { font-size: 1.2rem; color: #1e293b; }
        .tpl-5 .b-contact-row .label-text { color: #92400e; font-weight: bold; }

        /* ==========================================================
           🎨 TEMPLATES 6 to 10 (1.5-Inch Header & Centered Body Designs)
           ========================================================== */
        .inch-header {
            min-height: 38.1mm !important; /* 1.5 Inches */
            padding: 3mm 15mm;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            color: #ffffff;
            text-align: center;
        }

        .inch-header .b-name {
            font-size: clamp(1.8rem, 2.4rem, 2.6rem);
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            text-align: center;
        }

        .inch-footer {
            min-height: 25.4mm !important; /* 1 Inch base */
            padding: 3mm 15mm;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            position: relative;
            color: #ffffff;
        }

        .inch-footer .b-contact-row {
            font-size: 1.15rem;
        }

        .inch-body {
            flex-grow: 1;
            background: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .inch-body .b-prop {
            padding: 4mm 15mm 2mm 15mm;
            text-align: right;
            direction: rtl;
        }

        /* Template 6: Slate & Golden Geometric */
        .tpl-6 .inch-header { background-color: #1e293b; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 4px solid #fbbf24; }
        .tpl-6 .b-name { text-shadow: 2px 2px 4px rgba(0,0,0,0.4); }
        .tpl-6 .b-prop span { color: #b45309 !important; }
        .tpl-6 .b-prop bdi { color: #0f172a; }
        .tpl-6 .inch-footer { background-color: #0f172a; border-top: 4px solid #fbbf24; color: #ffffff; }
        .tpl-6 .label-text { color: #fbbf24; font-weight: bold; }

        /* Template 7: Luxury Crimson */
        .tpl-7 .inch-header { background-color: #881337; background: linear-gradient(90deg, #881337 0%, #4c0519 100%); border-bottom: 4px solid #f43f5e; }
        .tpl-7 .b-name { text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        .tpl-7 .b-prop span { color: #9f1239 !important; }
        .tpl-7 .b-prop bdi { color: #4c0519; }
        .tpl-7 .inch-footer { background-color: #4c0519; background: linear-gradient(90deg, #4c0519 0%, #881337 100%); border-top: 4px solid #f43f5e; color: #ffffff; }
        .tpl-7 .label-text { color: #fda4af; font-weight: bold; }

        /* Template 8: Vibrant Teal */
        .tpl-8 .inch-header { background-color: #0d9488; background: linear-gradient(135deg, #0d9488 0%, #115e59 100%); border-bottom: 4px solid #f97316; }
        .tpl-8 .b-prop span { color: #0f766e !important; }
        .tpl-8 .b-prop bdi { color: #134e4a; }
        .tpl-8 .inch-footer { background-color: #115e59; border-top: 4px solid #f97316; color: #ffffff; }
        .tpl-8 .label-text { color: #fed7aa; font-weight: bold; }

        /* Template 9: Royal Indigo */
        .tpl-9 .inch-header { background-color: #4c1d95; background: linear-gradient(135deg, #4c1d95 0%, #31106a 100%); border-bottom: 4px solid #a855f7; }
        .tpl-9 .b-name { text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .tpl-9 .b-prop span { color: #6b21a8 !important; }
        .tpl-9 .b-prop bdi { color: #3b0764; }
        .tpl-9 .inch-footer { background-color: #31106a; border-top: 4px solid #a855f7; color: #ffffff; }
        .tpl-9 .label-text { color: #e9d5ff; font-weight: bold; }

        /* Template 10: Olive Green & Ochre */
        .tpl-10 .inch-header { background-color: #064e3b; background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border-bottom: 4px solid #d97706; }
        .tpl-10 .b-prop span { color: #047857 !important; }
        .tpl-10 .b-prop bdi { color: #064e3b; }
        .tpl-10 .inch-footer { background-color: #022c22; border-top: 4px solid #d97706; color: #ffffff; }
        .tpl-10 .label-text { color: #fcd34d; font-weight: bold; }

        /* Print Media Override (Safari WebKit Height Truncation Fix & Zero Overflow) */
        @media print {
            html, body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                height: auto !important;
                min-height: 100% !important;
                overflow: visible !important;
            }
            body { display: block !important; }
            body, .flex-1, .app-root, .preview-wrapper, main {
                overflow: visible !important;
                height: auto !important;
            }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .ui-controls, .app-header, .no-print, .theme-toggle, #toast, #virtual-keyboard, #kb-reset-pos-btn { display: none !important; }
            main, .preview-wrapper { 
                padding: 0 !important; 
                margin: 0 !important; 
                background: transparent !important; 
                transform: none !important; 
                overflow: visible !important; 
                display: block !important; 
                flex: none !important;
                width: 100% !important;
                height: auto !important;
            }
            .scale-wrapper, #scale-wrapper { 
                transform: none !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 210mm !important; 
                height: 296.8mm !important; 
                display: block !important;
            }
            .a4-container {
                box-shadow: none !important;
                margin: 0 auto !important;
                padding: 0 !important;
                width: 210mm !important;
                height: 296.8mm !important;
                max-height: 296.8mm !important;
                overflow: hidden !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
                break-after: avoid-page !important;
                break-inside: avoid !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .a4-container.tpl-2 { display: flex !important; flex-direction: row !important; }
            .a4-container.tpl-5 { padding: 8mm !important; }
            @page { size: A4 portrait; margin: 0; }
        }

        .scale-wrapper { transform-origin: top center; transition: transform 0.25s ease; }

        #toast {
            visibility: hidden; min-width: 260px; background-color: #1e293b; color: #ffffff; text-align: center; border-radius: 8px; padding: 12px 18px; position: fixed; z-index: 10000; left: 50%; transform: translateX(-50%); bottom: 30px; font-size: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: visibility 0.4s, opacity 0.4s linear; opacity: 0;
        }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 h-screen flex flex-col overflow-hidden transition-colors duration-300">

    <!-- Application Header -->
    <header class="app-header bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 py-3 px-4 md:px-6 flex items-center justify-between z-20 shrink-0 transition-colors duration-300">
        <div class="flex items-center gap-3">
            <div class="h-10 w-10 md:h-11 md:w-11 rounded-full bg-primary/10 flex items-center justify-center border-2 border-primary/30 text-primary">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-gray-800 dark:text-white font-urdu-clean">عطا لیٹر پیڈ جنریٹر</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3">
            <!-- Reset Button to clear/restore defaults -->
            <button onclick="confirmReset()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition border border-gray-200 dark:border-gray-600 text-xs font-bold font-sans" title="ڈیفالٹ بحال کریں">
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>Reset</span>
            </button>

            <!-- Physical Typing Toggle (Urdu / English) -->
            <button id="typing-toggle-btn" onclick="togglePhoneticTyping()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-blue-50 dark:bg-blue-900/40 text-primary dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-800/50 transition border border-blue-200 dark:border-blue-700 text-xs font-bold" title="کی بورڈ ٹائپنگ تبدیل کریں (Alt+U)">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span id="typing-toggle-text">اردو ٹائپنگ</span>
            </button>

        const STORAGE_KEY = 'atta_letterpad_data_v1';
        let currentTemplate = 1;

        let isNumberMode = false;
        let isPhoneticActive = true;
        let activeInput = null;
        let customLogoData = '';
// State variables declared globally at top of script
        let isCustomPositioned = false;
        let isExporting = false;

        // Lightweight, zero-dependency HTML escaper to neutralize DOM XSS (SEC-01)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Multi-line formatting helper converting newlines to <br> safely
        function formatMultiline(str) {
            return escapeHtml(str).replace(/\r?\n/g, '<br>');
        }

        // Custom Toast Function with Race Condition Prevention
        let toastTimeoutId = null;
        function showToast(msg) {
            const toast = document.getElementById("toast");
            if (toastTimeoutId) {
                clearTimeout(toastTimeoutId);
                toastTimeoutId = null;
            }
            toast.innerText = msg;
            toast.className = "show";
            toastTimeoutId = setTimeout(() => { 
                toast.className = toast.className.replace("show", ""); 
                toastTimeoutId = null;
            }, 3200);
        }

        // Dark mode logic
        window.toggleDarkMode = function() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            try {
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            } catch (e) {
                console.warn('Storage blocked. Visual toggle applied.');
            }
        };

        // Logo Container Component with Strict Base64 Validation
        function buildLogoHtml() {
            if (!customLogoData) return '';
            if (!/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(customLogoData)) {
                return '';
            }
            return `<img src="${customLogoData}" class="pad-logo" alt="Logo">`;
        }

        // Templates 1 to 10 Definitions with Conditional Footer Rows
        const templates = {

        // Memory-safe image downscaling via Object URLs to avoid heap bloat
        function downscaleImage(file, maxW = 400, maxH = 200) {
            return new Promise((resolve, reject) => {
                const objectUrl = URL.createObjectURL(file);
                const img = new Image();
                const cleanup = () => {
                    try { URL.revokeObjectURL(objectUrl); } catch (_) {}
                };
                img.onerror = (err) => {
                    cleanup();
                    reject(err);
                };
                img.onload = () => {
                    try {
                        let w = img.width;
                        let h = img.height;
                        if (!w || !h || w <= 0 || h <= 0) {
                            cleanup();
                            reject(new Error('تصویر کے سائز درست نہیں ہیں۔'));
                            return;
                        }
                        if (w > maxW || h > maxH) {
                            const ratio = Math.min(maxW / w, maxH / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        if (!ctx) {
                            cleanup();
                            reject(new Error('کینوس کنٹیکسٹ دستیاب نہیں ہے۔'));
                            return;
                        }
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, w, h);
                        cleanup();
                        const dataUrl = canvas.toDataURL('image/png');
                        canvas.width = 0;
                        canvas.height = 0;
                        resolve(dataUrl);
                    } catch (err) {
                        cleanup();
                        reject(err);
                    }
                };
                img.src = objectUrl;
            });
        }

            const wrapper = document.getElementById('scale-wrapper');

            if (!wrapper || !letterpad || !scrollArea) return;

            const computedStyle = window.getComputedStyle(scrollArea);
            const horizontalPadding = (parseFloat(computedStyle.paddingLeft) || 16) + (parseFloat(computedStyle.paddingRight) || 16);
            const availableWidth = scrollArea.clientWidth - horizontalPadding;
            const a4Width = letterpad.offsetWidth || 794;
            const a4Height = letterpad.offsetHeight || 1123;

            if (availableWidth < a4Width) {
                const scale = availableWidth / a4Width;
                wrapper.style.transform = `scale(${scale})`;
                wrapper.style.marginBottom = `-${(a4Height * (1 - scale))}px`;
            } else {
                wrapper.style.transform = 'scale(1)';

            }
        }

        // Factory function: Instantiates fresh SpeechRecognition with complete event bindings
        function createSpeechRecognitionInstance() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return null;

            const instance = new SpeechRecognition();
            instance.lang = isPhoneticActive ? 'ur-PK' : 'en-US';
            instance.continuous = true;
            instance.interimResults = true;
            instance.maxAlternatives = 1;

            instance.onstart = () => {
                isRecording = true;
                startVoiceIndicator();
            };

            instance.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const res = event.results[i];
                    const transcript = res[0].transcript;
                    if (res.isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Render live streaming speech feedback in real time
                updateVoiceInterimDisplay(interimTranscript);

                if (finalTranscript.trim()) {
                    insertVoiceText(finalTranscript.trim());
                    updateVoiceInterimDisplay('');
                }
            };

            instance.onerror = (e) => {
                console.warn('SpeechRecognition error:', e.error);
                if (e.error === 'no-speech') {
                    updateVoiceInterimDisplay('');
                    return;
                }

                stopVoiceIndicator();
                recognition = null;

                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {

                    showToast("مائیکروفون دستیاب نہیں ہے یا کسی دوسری ایپ میں استعمال ہو رہا ہے۔");
                } else if (e.error === 'network') {
                    if (window.location.protocol === 'file:') {
                        showToast("کروم file:// پر اسپیچ نیٹ ورک نہیں دیتا۔ برائے مہربانی http://localhost:3000 استعمال کریں۔");

                    if (instance.lang === 'ur-PK') {
                        console.warn('ur-PK unsupported, falling back to ur');
                        instance.lang = 'ur';
                        try { instance.start(); return; } catch (_) {}

                }
            };

            instance.onend = () => {
                stopVoiceIndicator();
                recognition = null;
            };

            return instance;
        }

        function insertVoiceText(text) {
            if (!activeInput) {
                activeInput = document.getElementById('input-name');
            }
            if (!activeInput) return;

            const cleanText = text.trim();
            if (!cleanText) return;

            const start = (typeof activeInput.selectionStart === 'number') ? activeInput.selectionStart : activeInput.value.length;
            const end = (typeof activeInput.selectionEnd === 'number') ? activeInput.selectionEnd : activeInput.value.length;
            const val = activeInput.value;

            const needLeadingSpace = (start > 0 && val[start - 1] !== ' ' && val[start - 1] !== '\n');
            const toInsert = (needLeadingSpace ? ' ' : '') + cleanText;

            activeInput.value = val.substring(0, start) + toInsert + val.substring(end);
            const newPos = start + toInsert.length;
            activeInput.selectionStart = activeInput.selectionEnd = newPos;

            activeInput.dispatchEvent(new Event('input', { bubbles: true }));
            activeInput.focus();
        }

        // ⌨️ Floating Virtual Keyboard & Focus Ergonomics
        // ==========================================================

        function updateActiveTarget(input) {
            if (!input) input = document.getElementById('input-name');
            activeInput = input;

            const targetNameEl = document.getElementById('kb-target-name');
            if (targetNameEl) {
                targetNameEl.textContent = FIELD_LABELS[input.id] || input.placeholder || 'نامعلوم';
            }

            document.querySelectorAll('.urdu-input').forEach(el => {
                el.classList.remove('ring-2', 'ring-primary', 'border-primary');
            });
            input.classList.add('ring-2', 'ring-primary', 'border-primary');

            scrollInputIntoView(input);
        }

        function scrollInputIntoView(inputElem) {
            if (!inputElem) return;
            const kb = document.getElementById('virtual-keyboard');
            const isKbOpen = kb && (isCustomPositioned ? (kb.style.opacity !== '0' && kb.style.display !== 'none') : !kb.classList.contains('translate-y-full'));
            const scrollContainer = document.querySelector('.ui-controls > div');

            if (scrollContainer) {
                scrollContainer.style.paddingBottom = isKbOpen ? (isKeyboardMinimized ? '70px' : '280px') : '';
            }

            setTimeout(() => {
                inputElem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function setVirtualKeyboardMode(enabled) {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.innerWidth < 1024);
            const inputs = document.querySelectorAll('.urdu-input');
            inputs.forEach(input => {
                if (enabled && isTouch) {
                    input.setAttribute('inputmode', 'none');
                } else {
                    input.removeAttribute('inputmode');
                }
            });
        }

        function initKeyboard() {
            const inputs = document.querySelectorAll('.urdu-input');
            inputs.forEach(el => {
                el.addEventListener('focus', function() {
                    updateActiveTarget(this);
                });
                
                el.addEventListener('keydown', function(e) {
                    if (isPhoneticActive && e.shiftKey && (e.code === 'Space' || e.key === ' ')) {
                        e.preventDefault();
                        const zwnj = '\u200C';
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        this.value = this.value.substring(0, start) + zwnj + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + 1;
                        this.dispatchEvent(new Event('input', { bubbles: true }));
                        return;
                    }
                });

                el.addEventListener('keypress', function(e) {
                    if (!isPhoneticActive) return;
                    if (e.ctrlKey || e.altKey || e.metaKey) return;
                    const mappedChar = phoneticMap[e.key];
                    if (mappedChar) {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        this.value = this.value.substring(0, start) + mappedChar + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + mappedChar.length;
                        this.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                });
            });

            // Close keyboard on clicks outside, but protect .ui-controls and toggle buttons
            document.addEventListener('pointerdown', (e) => {
                if (!e.target.closest('#virtual-keyboard') && 
                    !e.target.closest('.urdu-input') && 
                    !e.target.closest('.ui-controls') &&
                    !e.target.closest('#typing-toggle-btn') &&
                    !e.target.closest('button[onclick="toggleKeyboard()"]')) {
                    hideKeyboard();
                }
            });

            renderKeyboard();
            initKeyboardDragging();

            // Window resize handler for scaling & draggable boundary clamps
            window.addEventListener('resize', () => {
                adjustScale();
                const kb = document.getElementById('virtual-keyboard');
                if (!kb || !isCustomPositioned) return;
                if (window.innerWidth < 768) {
                    resetKeyboardPosition();
                } else {
                    const maxLeft = window.innerWidth - kb.offsetWidth - 10;
                    const maxTop = window.innerHeight - kb.offsetHeight - 10;
                    const curLeft = parseFloat(kb.style.left) || 10;
                    const curTop = parseFloat(kb.style.top) || 10;
                    kb.style.left = `${Math.max(10, Math.min(curLeft, maxLeft))}px`;
                    kb.style.top = `${Math.max(10, Math.min(curTop, maxTop))}px`;
                }
            });
        }

        function resetKeyboardPosition() {
            const kb = document.getElementById('virtual-keyboard');
            if (!kb) return;
            isCustomPositioned = false;
            kb.style.left = '';
            kb.style.top = '';
            kb.style.bottom = '';
            kb.style.transform = '';
            kb.style.opacity = '';

        function initKeyboardDragging() {
            const kb = document.getElementById('virtual-keyboard');
            const header = document.getElementById('kb-header');
            if (!kb || !header) return;

            let isDragging = false;
            let startX, startY, initLeft, initTop;

            header.addEventListener('pointerdown', (e) => {
                if (window.innerWidth < 768 || e.target.closest('button')) return;

                isDragging = true;
                header.setPointerCapture(e.pointerId);
                
                const rect = kb.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                initLeft = rect.left;
                initTop = rect.top;

                kb.style.left = `${initLeft}px`;
                kb.style.top = `${initTop}px`;
                kb.style.bottom = 'auto';
                kb.style.transform = 'none';
                kb.style.transition = 'none';
                isCustomPositioned = true;
                document.getElementById('kb-reset-pos-btn').classList.remove('hidden');
            });

            header.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                let newLeft = initLeft + dx;
                let newTop = initTop + dy;

                const maxLeft = window.innerWidth - kb.offsetWidth - 10;
                const maxTop = window.innerHeight - kb.offsetHeight - 10;
                newLeft = Math.max(10, Math.min(newLeft, maxLeft));
                newTop = Math.max(10, Math.min(newTop, maxTop));

                kb.style.left = `${newLeft}px`;
                kb.style.top = `${newTop}px`;
            });

            const stopDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;
                try { header.releasePointerCapture(e.pointerId); } catch (_) {}
                kb.style.transition = 'transform 0.3s ease, opacity 0.2s ease';
            };

            header.addEventListener('pointerup', stopDrag);
            header.addEventListener('pointercancel', stopDrag);
            header.addEventListener('lostpointercapture', stopDrag);
        }

        // Handle virtual key click
        function handleKey(char) {
            if (!activeInput) {
                updateActiveTarget(document.getElementById('input-name'));
            }
            const len = activeInput.value ? activeInput.value.length : 0;
            const start = (typeof activeInput.selectionStart === 'number' && activeInput.selectionStart !== null) ? activeInput.selectionStart : len;
            const end = (typeof activeInput.selectionEnd === 'number' && activeInput.selectionEnd !== null) ? activeInput.selectionEnd : len;
            const val = activeInput.value;

            if (char === 'bksp') {
                if (start > 0 || start !== end) {
                    const removeStart = start === end ? start - 1 : start;
                    activeInput.value = val.substring(0, removeStart) + val.substring(end);
                    activeInput.selectionStart = activeInput.selectionEnd = removeStart;
                }
            } else {
                activeInput.value = val.substring(0, start) + char + val.substring(end);
                activeInput.selectionStart = activeInput.selectionEnd = start + char.length;
            }
            activeInput.dispatchEvent(new Event('input', { bubbles: true }));
            activeInput.focus();
        }

        function toggleKeyboard() {
            const kb = document.getElementById('virtual-keyboard');
            const isHidden = isCustomPositioned ? (kb.style.opacity === '0') : kb.classList.contains('translate-y-full');
            if (isHidden) {
                let targetInput = activeInput || document.getElementById('input-name');
                showKeyboard(targetInput);
            } else {
                hideKeyboard();
            }
        }

        function showKeyboard(inputElem) {
            updateActiveTarget(inputElem);
            const kb = document.getElementById('virtual-keyboard');
            if (isCustomPositioned) {
                kb.style.opacity = '1';
                kb.style.pointerEvents = 'auto';
            } else {
                kb.classList.remove('translate-y-full');
            }
            kb.removeAttribute('inert');
            kb.setAttribute('aria-hidden', 'false');

            const toggleBtn = document.getElementById('kb-toggle-btn');
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');

            isShift = false;
            setVirtualKeyboardMode(true);
            renderKeyboard();
            if (activeInput) {
                activeInput.focus();
                scrollInputIntoView(activeInput);
            }
        }

        function hideKeyboard() {
            const kb = document.getElementById('virtual-keyboard');
            if (isCustomPositioned) {
                kb.style.opacity = '0';
                kb.style.pointerEvents = 'none';
            } else {
                kb.classList.add('translate-y-full');
            }
            kb.setAttribute('inert', '');
            kb.setAttribute('aria-hidden', 'true');

            const toggleBtn = document.getElementById('kb-toggle-btn');
            if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');

            if (isRecording) {
                toggleVoice();
            }
            setVirtualKeyboardMode(false);
            const scrollContainer = document.querySelector('.ui-controls > div');
            if (scrollContainer) {
                scrollContainer.style.paddingBottom = '';
            }

            if (toggleBtn) {
                toggleBtn.focus();
            } else if (activeInput && document.body.contains(activeInput)) {
                activeInput.focus();
            }
        }


        // Global Escape key shortcut to dismiss virtual keyboard
        window.addEventListener('keydown', (e) => {

        // Pre-flight check for external CDN dependencies
        function verifyExportLibraries(needPdf = false) {
            if (typeof window.htmlToImage === 'undefined') {
                showToast("ایکسپورٹ لائبریری لوڈ نہیں ہو سکی۔ براہ کرم انٹرنیٹ چیک کریں یا 'Print' استعمال کریں۔");

        // Asynchronous Timeout Wrapper to Prevent Permanent UI Deadlocks
        function withTimeout(promise, ms = 12000, errorMsg = 'عمل میں زیادہ وقت لگ گیا۔ دوبارہ کوشش کریں۔') {
            let timerId = null;
            const timeoutPromise = new Promise((_, reject) => {
                timerId = setTimeout(() => {
                    const err = new Error(errorMsg);
                    err.name = 'TimeoutError';
                    reject(err);
                }, ms);
            });
            return Promise.race([promise, timeoutPromise]).finally(() => {
                if (timerId) clearTimeout(timerId);
            });
        }

        // Prepare DOM for Export with Layout Guarantees
        async function prepareForExport() {
            const wrapper = document.getElementById('scale-wrapper');
            const pad = document.getElementById('letterpad');
            const scrollArea = document.getElementById('preview-scroll-area');

            const originalTransform = wrapper.style.transform;
            const originalTransition = wrapper.style.transition;
            const originalMarginBottom = wrapper.style.marginBottom;
            const originalShadow = pad.style.boxShadow;
            const originalScrollTop = scrollArea ? scrollArea.scrollTop : 0;
            const originalScrollLeft = scrollArea ? scrollArea.scrollLeft : 0;

            const restore = () => {
                if (originalShadow) {
                    pad.style.setProperty('box-shadow', originalShadow);
                } else {
                    pad.style.removeProperty('box-shadow');
                }
                if (scrollArea) {
                    scrollArea.scrollTop = originalScrollTop;
                    scrollArea.scrollLeft = originalScrollLeft;
                }
                wrapper.style.transition = 'none';
                wrapper.style.transform = originalTransform;
                wrapper.style.marginBottom = originalMarginBottom;
                void wrapper.offsetHeight;
                wrapper.style.transition = originalTransition;
            };

            try {
                if (scrollArea) {
                    scrollArea.scrollTop = 0;
                    scrollArea.scrollLeft = 0;
                }

                wrapper.style.transition = 'none';
                wrapper.style.transform = 'scale(1)';
                wrapper.style.marginBottom = '0px';
                pad.style.setProperty('box-shadow', 'none', 'important');
                void wrapper.offsetHeight; // Force layout flush

                if (document.fonts && document.fonts.ready) {
                    try { await document.fonts.ready; } catch (_) {}
                }

                const logoImg = pad.querySelector('.pad-logo');
                if (logoImg && !logoImg.complete) {
                    try { await logoImg.decode(); } catch (_) {}
                }

                await new Promise(resolve => setTimeout(resolve, 80));
                return restore;
            } catch (err) {
                restore();
                throw err;
            }
        }

        // Memory-Safe Blob Downloader
        function triggerBlobDownload(dataUrl, filename) {
            try {
                const parts = dataUrl.split(';base64,');
                const contentType = parts[0].split(':')[1];
                const raw = window.atob(parts[1]);
                const rawLength = raw.length;
                const uInt8Array = new Uint8Array(rawLength);
                for (let i = 0; i < rawLength; ++i) {
                    uInt8Array[i] = raw.charCodeAt(i);
                }
                const blob = new Blob([uInt8Array], { type: contentType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = filename;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch(e) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // Adaptive Resolution Renderer (Prevents Canvas OOM crashes on iOS / low-memory devices)
        async function renderElementToDataUrl(element, format = 'png', preferredRatio = 2.5) {
            const ratios = [preferredRatio, 1.75, 1.0];
            const exportBg = (currentTemplate === 4) ? '#fffcf2' : '#ffffff';
            let lastErr = null;

            for (const ratio of ratios) {
                try {
                    const options = {
                        pixelRatio: ratio,
                        backgroundColor: exportBg,
                        cacheBust: true
                    };
                    if (format === 'jpeg') {
                        options.quality = 0.95;
                        return await withTimeout(htmlToImage.toJpeg(element, options), 12000);
                    } else {
                        return await withTimeout(htmlToImage.toPng(element, options), 12000);
                    }
                } catch (err) {
                    console.warn(`Export canvas failed at ratio ${ratio}, retrying lower resolution:`, err);
                    lastErr = err;
                    if (err && err.name === 'TimeoutError') {
                        break; // Do not cascade 36-second retries on persistent engine timeouts
                    }
                }
            }
            throw lastErr;
        }

        // Download High-Resolution PDF (Crisp Vector Canvas with Single-Page Clamp)
        async function downloadPDF() {
            if (!verifyExportLibraries(true)) return;
            if (isExporting) {
                showToast("ایکسپورٹ کا عمل جاری ہے، براہ کرم انتظار کریں۔");
                return;
            }
            isExporting = true;
            const element = document.getElementById('letterpad');
            let restoreDOM = null;

            try {
                showToast("پی ڈی ایف تیار ہو رہا ہے...");
                restoreDOM = await prepareForExport();
                
                const dataUrl = await renderElementToDataUrl(element, 'png', 2.5);

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = doc.internal.pageSize.getHeight();
                doc.addImage(dataUrl, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
                
                // Enforce single-page clamp
                while (doc.getNumberOfPages() > 1) {
                    doc.deletePage(doc.getNumberOfPages());
                }
                doc.save('Atta-Letterpad.pdf');
                showToast("پی ڈی ایف کامیابی سے ڈاؤنلوڈ ہو گیا!");
            } catch (error) {
                console.error('Error generating PDF:', error);
                showToast("پی ڈی ایف بنانے میں مسئلہ پیش آیا۔ آپ براہ کرم 'Print' کا بٹن استعمال کر سکتے ہیں۔");
            } finally {
                if (restoreDOM) restoreDOM();
                isExporting = false;
            }
        }

        // Download Crisp PNG Image
        async function downloadPNG() {
            if (!verifyExportLibraries(false)) return;
            if (isExporting) {
                showToast("ایکسپورٹ کا عمل جاری ہے، براہ کرم انتظار کریں۔");
                return;
            }
            isExporting = true;
            const element = document.getElementById('letterpad');
            let restoreDOM = null;

            try {
                showToast("تصویر (PNG) تیار ہو رہی ہے...");
                restoreDOM = await prepareForExport();

                const dataUrl = await renderElementToDataUrl(element, 'png', 2.5);
                triggerBlobDownload(dataUrl, 'Atta-Letterpad.png');
                showToast("تصویر (PNG) ڈاؤنلوڈ ہو گئی!");
            } catch (error) {
                console.error('Error generating PNG:', error);
                showToast("تصویر بنانے میں مسئلہ پیش آیا۔ دوبارہ کوشش کریں۔");
            } finally {
                if (restoreDOM) restoreDOM();
                isExporting = false;
            }
        }

        // Download JPG Image (Memory-Safe Blob Downloader)
        async function downloadJPG() {
            if (!verifyExportLibraries(false)) return;
            if (isExporting) {
                showToast("ایکسپورٹ کا عمل جاری ہے، براہ کرم انتظار کریں۔");
                return;
            }
            isExporting = true;
            const element = document.getElementById('letterpad');
            let restoreDOM = null;

            try {
                showToast("تصویر (JPG) تیار ہو رہی ہے...");
                restoreDOM = await prepareForExport();

                const dataUrl = await renderElementToDataUrl(element, 'jpeg', 2.5);
                triggerBlobDownload(dataUrl, 'Atta-Letterpad.jpg');
                showToast("تصویر (JPG) ڈاؤنلوڈ ہو گئی!");
            } catch (error) {
                console.error('Error generating JPG:', error);
                showToast("تصویر بنانے میں مسئلہ پیش آیا۔ دوبارہ کوشش کریں۔");
            } finally {
                if (restoreDOM) restoreDOM();
                isExporting = false;
            }
        }
    </script>
</body>
